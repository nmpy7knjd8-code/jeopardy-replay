:root{--blue:#060CE9;--blue-d:#04088f;--blue-dd:#02045c;--gold:#E8B84B;--gold-b:#FFD966;--red:#d8282f;--green:#2bbf62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:500;user-select:none;-webkit-user-select:none}
#app{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 35%,#1219ff 0%,var(--blue) 45%,var(--blue-d) 100%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{padding-top:max(env(safe-area-inset-top),0px);flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#hud{flex:none;display:flex;justify-content:center;align-items:center;gap:3vmin;padding:.8vmin 2vmin max(2vmin,env(safe-area-inset-bottom));position:relative;z-index:16}
#mute{position:absolute;right:2vmin;top:50%;transform:translateY(-50%);background:none;border:0;font-size:max(18px,3.4vmin);opacity:.6;cursor:pointer;padding:1vmin}
#hud.hide{display:none}
.scorebox{background:linear-gradient(#0a10ff,#0207a8);border:.5vmin solid #000;outline:.35vmin solid #6a70ff;border-radius:.5vmin;min-width:26vmin;padding:.2vmin 2vmin;text-align:center;font-family:Anton,Impact,sans-serif;font-size:max(20px,4.6vmin);letter-spacing:.04em;line-height:1.15;text-shadow:.25vmin .25vmin 0 #000}
.scorebox small{display:block;font:500 max(9px,1.7vmin)/1 Oswald,sans-serif;letter-spacing:.2em;color:#aab0ff;margin-top:-.1vmin}
.scorebox.neg{color:#ff6a6a}
.scorebox.pos{color:#fff}
#hud .info{font-size:max(11px,2.2vmin);letter-spacing:.12em;color:#aab0ff;text-transform:uppercase;text-align:center;line-height:1.5}
/* board */
.board{flex:none;margin:0;width:96%;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:2px;background:#000}
.cat,.cell{background:linear-gradient(180deg,#0b12ff,var(--blue) 40%,#0509c4);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;box-shadow:inset 0 0 0 .25vmin rgba(255,255,255,.08),inset 0 -1vmin 2vmin rgba(0,0,40,.35)}
.cat{font-family:Anton,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;color:#fff;font-size:12px;line-height:1.1;padding:.3vmin .4vmin;letter-spacing:0;text-shadow:.15vmin .2vmin 0 #000;text-align:center;min-height:0}
.cat span{display:block;width:100%;text-align:center;overflow-wrap:normal;word-break:normal;hyphens:none;-webkit-hyphens:none}
.cell{font-family:Anton,Impact,sans-serif;color:var(--gold);text-shadow:.3vmin .35vmin 0 #000;letter-spacing:.02em;min-height:0}
.cell span{font-size:var(--vf,12px);line-height:1;white-space:nowrap}
.cell.used{background:var(--blue);box-shadow:none;color:transparent;text-shadow:none}
.cell.flash{animation:flash .22s steps(2) 4}
@keyframes flash{0%{background:#fff;color:#000;text-shadow:none}100%{background:var(--blue)}}
/* generic panels */
.panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:3vmin 5vmin;gap:2.4vmin;min-height:0;overflow:auto}
.logo{font-family:Anton,Impact,sans-serif;font-size:min(14vw,22vh);letter-spacing:.04em;line-height:1;color:var(--gold);text-shadow:.7vmin .8vmin 0 #000;text-transform:uppercase}
.sub{font-size:max(13px,3vmin);letter-spacing:.2em;text-transform:uppercase;color:#cfd2ff}
.h1{font-family:Anton,Impact,sans-serif;font-size:min(9vw,15vh);text-transform:uppercase;color:#fff;text-shadow:.6vmin .7vmin 0 #000;line-height:1.05;letter-spacing:.03em}
.gold{color:var(--gold)}
.serif{font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;font-weight:700}
.btn{font-family:Anton,Impact,sans-serif;font-size:max(18px,4.2vmin);letter-spacing:.08em;text-transform:uppercase;color:#1a1200;background:linear-gradient(#ffe38a,var(--gold) 55%,#c48f22);border:0;border-radius:1vmin;padding:1.2vmin 4.5vmin;cursor:pointer;box-shadow:0 .6vmin 0 #7a5610,0 1vmin 2vmin rgba(0,0,0,.5)}
.btn:active{transform:translateY(.4vmin);box-shadow:0 .2vmin 0 #7a5610}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:.25vmin solid rgba(255,255,255,.5);font-size:max(13px,2.6vmin);padding:.8vmin 2.4vmin}
.contestants{display:flex;gap:2.5vmin;flex-wrap:wrap;justify-content:center}
.contestants div{background:rgba(0,0,0,.28);border:.25vmin solid rgba(255,255,255,.2);padding:1.2vmin 2vmin;border-radius:1vmin;max-width:34vmin;font-size:max(12px,2.3vmin);line-height:1.35;color:#cfd2ff}
.contestants b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:max(17px,3.4vmin);color:#fff;letter-spacing:.05em;text-transform:uppercase}
.rules{list-style:none;padding:0;margin:0;font-size:max(12px,2.4vmin);color:#cfd2ff;line-height:1.7;max-width:90vmin}
.rules b{color:var(--gold)}
/* clue card */
.card{flex:1;display:flex;flex-direction:column;padding:2vmin 3.5vmin 1.4vmin;overflow:hidden;min-height:0;position:relative;animation:zoom .35s ease-out}
@keyframes zoom{from{transform:scale(.4);opacity:.2}to{transform:none;opacity:1}}
.banner{flex:none;margin:-1.5vmin -2.5vmin 1.4vmin;padding:1.4vmin 3vmin 1.2vmin;background:linear-gradient(#02045c,#03067f);border-bottom:.6vmin solid var(--gold);display:flex;flex-direction:column;align-items:center;gap:.4vmin;text-align:center;font-family:Anton,Impact,sans-serif;text-transform:uppercase;text-shadow:.3vmin .35vmin 0 #000;box-shadow:0 1vmin 2vmin rgba(0,0,0,.35)}
.ccbox{width:100%;height:max(54px,15vmin);display:flex;align-items:center;justify-content:center;line-height:1.05}
.ccbox .cc{display:block;width:100%;font-size:max(20px,7vmin);color:#fff;letter-spacing:.03em;text-align:center}
.banner .cv{color:var(--gold);font-size:max(24px,6.4vmin);line-height:1;letter-spacing:.04em}
.clue{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;text-transform:uppercase;font-family:'Libre Baskerville',Georgia,'Times New Roman',serif;font-weight:700;line-height:1.28;text-shadow:.3vmin .4vmin 0 #000;padding:0 .5vmin;overflow:hidden;position:relative}
.clue .ct{display:block;width:100%;font-size:20px;overflow-wrap:break-word;hyphens:none}
.clue.ans{flex:none;font-size:max(15px,3.2vmin)!important;color:var(--gold);padding:.4vmin}
.imgnote{flex:none;text-align:center;font-size:max(11px,1.9vmin);color:#aab0ff;letter-spacing:.1em;text-transform:uppercase;padding-bottom:.8vmin}
.foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:1vmin;min-height:max(86px,17vmin);justify-content:flex-end;padding-top:1vmin}
.hint{font-size:max(13px,2.7vmin);letter-spacing:.14em;text-transform:uppercase;color:#cfd2ff;text-align:center}
.hint b{color:var(--gold-b)}
.buzz{font-family:Anton,Impact,sans-serif;font-size:max(24px,6vmin);letter-spacing:.12em;border:0;border-radius:50vmin;padding:1vmin 9vmin;cursor:pointer;color:#fff;background:linear-gradient(#5a5fff,#2229c9);box-shadow:0 .8vmin 0 #0a0d6b,0 1.2vmin 2vmin rgba(0,0,0,.5);opacity:.55}
.buzz.live{opacity:1;color:#2a1c00;background:linear-gradient(#fff6c8,var(--gold-b) 50%,#e0a21f);box-shadow:0 .8vmin 0 #7a5610,0 0 5vmin rgba(255,217,102,.8)}
.buzz:active{transform:translateY(.5vmin)}
.bar{width:min(90vmin,86vw);height:max(8px,1.6vmin);background:rgba(0,0,0,.45);border-radius:2vmin;overflow:hidden;border:.2vmin solid rgba(255,255,255,.25)}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-b));transform-origin:left}
.bar i.warn{background:linear-gradient(90deg,#ff6a3a,#ff9a5a)}
.answer-row{display:flex;gap:1.5vmin;width:min(110vmin,92vw);align-items:stretch}
.answer-row input{flex:1;min-width:0;font:700 max(18px,4vmin) 'Libre Baskerville',Georgia,serif;padding:1.3vmin 2vmin;border-radius:1vmin;border:.4vmin solid var(--gold);background:#02045c;color:#fff;outline:none;text-align:center;text-transform:none}
.answer-row input::placeholder{color:#7a80d8;font-weight:400}
.answer-row .btn{padding:1vmin 3vmin}
.lock{color:#ff7777!important}
.verdict{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:min(9vw,13vh);text-shadow:.5vmin .6vmin 0 #000;line-height:1.05}
.verdict.good{color:#58f08c}.verdict.bad{color:#ff6a6a}.verdict.meh{color:#cfd2ff}
.note{font-size:max(12px,2.4vmin);letter-spacing:.06em;color:#cfd2ff;max-width:95vmin;line-height:1.5;background:rgba(0,0,0,.25);padding:1vmin 2vmin;border-radius:1vmin;text-transform:none}
.note b{color:#fff}
.typed{font-size:max(12px,2.4vmin);color:#aab0ff}
/* lights */
.lights{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;transition:opacity .15s}
.lights.show{opacity:1}
.lights i{position:absolute;background:repeating-linear-gradient(var(--dir,90deg),#12175f 0 .9vmin,transparent .9vmin 2.2vmin)}
.lights .t,.lights .b{left:0;right:0;height:1.6vmin;--dir:90deg}
.lights .t{top:0}.lights .b{bottom:0}
.lights .l,.lights .r{top:0;bottom:0;width:1.6vmin;--dir:180deg}
.lights .l{left:0}.lights .r{right:0}
.lights.on i{background:repeating-linear-gradient(var(--dir),#fff8d0 0 .9vmin,transparent .9vmin 2.2vmin);filter:drop-shadow(0 0 1vmin #ffd966) drop-shadow(0 0 2.5vmin #ffb400)}
.lights.bad i{background:repeating-linear-gradient(var(--dir),#ff4a4a 0 .9vmin,transparent .9vmin 2.2vmin);filter:drop-shadow(0 0 1.5vmin #f00)}
/* daily double */
.dd{font-family:Anton,Impact,sans-serif;font-size:min(16vw,26vh);line-height:.95;color:var(--gold-b);text-transform:uppercase;text-shadow:.8vmin .9vmin 0 #000,0 0 6vmin rgba(255,217,102,.7);animation:ddpulse .55s ease-in-out infinite alternate}
@keyframes ddpulse{from{transform:scale(.94) rotate(-1.5deg)}to{transform:scale(1.05) rotate(1.5deg)}}
.flashbg{animation:bgflash .35s steps(2) 6}
@keyframes bgflash{0%{background:#000}100%{background:transparent}}
/* summary */
table.cmp{border-collapse:separate;border-spacing:0 .8vmin;width:min(120vmin,94vw);font-size:max(14px,3vmin)}
table.cmp td,table.cmp th{padding:1vmin 2vmin;text-align:right;white-space:nowrap}
table.cmp th{font:500 max(10px,1.9vmin) Oswald,sans-serif;color:#aab0ff;letter-spacing:.14em;text-transform:uppercase}
table.cmp td:first-child,table.cmp th:first-child{text-align:left}
table.cmp.end td:nth-child(2),table.cmp.end th:nth-child(2){text-align:left;width:100%}
table.cmp td{background:rgba(0,0,0,.3);font-family:Anton,Impact,sans-serif;letter-spacing:.04em}
table.cmp tr td:first-child{border-radius:1vmin 0 0 1vmin;font-size:1.05em;text-transform:uppercase}
table.cmp tr td:last-child{border-radius:0 1vmin 1vmin 0}
table.cmp tr.me td{background:linear-gradient(90deg,#ffe38a,var(--gold));color:#1a1200;text-shadow:none}
table.cmp td.neg{color:#ff8a8a}
table.cmp tr.me td.neg{color:#9a0000}
table.cmp td small{display:block;font:500 max(10px,1.8vmin) Oswald,sans-serif;letter-spacing:.06em;opacity:.8;text-transform:none}
.rank{font-family:Anton,Impact,sans-serif;font-size:max(12px,2.4vmin);color:#aab0ff;margin-right:1.2vmin}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:Anton,Impact,sans-serif;font-size:min(11vw,16vh);color:#ff6a6a;text-shadow:.5vmin .6vmin 0 #000;pointer-events:none;animation:toast .25s ease-out}
@keyframes toast{from{transform:translate(-50%,-50%) scale(1.5);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
@media (orientation:portrait){
 .card{padding:1.5vmin 2.5vmin 1vmin}
 .panel{padding:2vmin 3vmin}
}
@media (prefers-reduced-motion:reduce){.dd,.card,.cell.flash{animation:none}}

/* intro / episode picker */
.panel.intro{gap:1.8vmin;justify-content:center}
.panel.intro .logo{font-size:min(14vw,18vh)}
.eps{display:flex;flex-direction:column;gap:1.4vmin;width:min(100vmin,92vw)}
.ep{font:inherit;color:#fff;text-align:left;background:rgba(0,0,0,.28);border:.4vmin solid rgba(255,255,255,.22);border-radius:1.2vmin;padding:1.4vmin 2.2vmin;cursor:pointer;display:flex;flex-direction:column;gap:.5vmin}
.ep.sel{border-color:var(--gold);background:rgba(232,184,75,.16);box-shadow:0 0 0 .3vmin var(--gold) inset}
.ep .ed{font-size:max(11px,2.1vmin);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ep .en{font-family:Anton,Impact,sans-serif;font-size:max(17px,3.6vmin);letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
.ep .et{font-size:max(11px,2vmin);color:#cfd2ff;letter-spacing:.05em}
@media (orientation:landscape){.eps{flex-direction:row;width:min(150vmin,94vw)}.ep{flex:1}}

/* clue picture */
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.2vmin}
.body .clue{flex:1;min-height:0}
.pic{flex:0 0 42%;min-height:0;display:flex;align-items:center;justify-content:center}
.pic img{max-width:100%;max-height:100%;object-fit:contain;border:.45vmin solid #fff;border-radius:.8vmin;box-shadow:0 .8vmin 2vmin rgba(0,0,0,.55);background:#fff}
@media (orientation:landscape){.body.hasimg{flex-direction:row;gap:3vmin;align-items:stretch}.body.hasimg .pic{flex:0 0 38%}.body.hasimg .clue{flex:1}}

.skip{background:none;border:0;color:#aab0ff;font:500 max(12px,2.2vmin) Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:.6vmin 2vmin;cursor:pointer;text-decoration:underline;text-underline-offset:.5vmin;text-decoration-color:rgba(170,176,255,.45)}
.skip:active{color:#fff}

/* on-screen keyboard: keep clue + timer + answer box visible */
body.kb #hud,body.typing.kb #hud{display:none}
body.kb .banner{padding:.6vmin 2vmin .5vmin;margin-bottom:.6vmin}
body.kb .ccbox{height:max(34px,9vmin)}
body.kb .pic{flex-basis:26%}
body.kb .foot{min-height:0}
@media (max-height:520px){body.typing #hud{display:none}.banner{padding:.6vmin 2vmin .5vmin}.ccbox{height:max(34px,9vmin)}.foot{min-height:0}.pic{flex-basis:26%}}
.answer-row input{font-size:max(18px,4vmin)!important}

.bw{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;padding-top:.5vmin}
.ff{background:rgba(255,255,255,.08);border:.2vmin solid rgba(255,255,255,.18);border-radius:3vmin;color:#fff;font-size:max(18px,3.2vmin);line-height:1;padding:.7vmin 3vmin;opacity:.38;cursor:pointer;transition:opacity .15s;margin:0 auto;min-height:32px}
.ff:hover,.ff:active,.ff:focus-visible{opacity:1;background:rgba(255,255,255,.2)}

.set{position:relative;flex:none}
.set .p{position:absolute}

  linear-gradient(#e0a43a,#e0a43a) 0 calc(var(--s)*8)/100% calc(var(--s)*2.6) no-repeat,

.pr-cat{font-weight:600}
.set .cell .dl{font-size:.9em!important;top:0!important;margin-right:.05em!important}

/* ===================== Unified controls =====================
   one shape (pill / circle), one border weight, one ghost treatment, three size tiers */
:root{--pill:999px;--bw:1.5px;--ghost-bg:rgba(255,255,255,.07);--ghost-bd:rgba(255,255,255,.32);--ghost-fg:#e3e6ff;
 --gold-face:linear-gradient(#fff2b8,var(--gold-b) 45%,#d99a1e);--gold-edge:rgba(90,60,0,.6);--gold-drop:0 3px 0 #7a5610,0 5px 12px rgba(0,0,0,.35);--ic:max(30px,4.4vmin)}
/* primary (gold pill): Start, Continue, GO, live BUZZ */
.btn,.buzz{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.1em;border-radius:var(--pill);cursor:pointer;line-height:1.1}
.btn,.buzz.live{color:#2a1c00;background:var(--gold-face);border:var(--bw) solid var(--gold-edge);box-shadow:var(--gold-drop);opacity:1}
.btn{font-size:max(17px,3.2vmin);padding:max(9px,1.3vmin) max(30px,5vmin);min-height:44px}
.buzz{font-size:max(24px,5.4vmin);padding:max(8px,1.2vmin) max(42px,8vmin);min-height:52px}
.buzz.live{box-shadow:var(--gold-drop),0 0 4vmin rgba(255,217,102,.7)}
.btn:active,.buzz:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5610}
/* idle BUZZ = same pill, ghost treatment */
.buzz:not(.live){color:rgba(255,255,255,.55);background:var(--ghost-bg);border:var(--bw) solid var(--ghost-bd);box-shadow:none;opacity:1}
/* secondary (ghost pill): skip, ghost buttons */
.skip,.btn.ghost{font:500 max(12px,1.8vmin)/1 Oswald,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ghost-fg);background:var(--ghost-bg);border:var(--bw) solid var(--ghost-bd);border-radius:var(--pill);padding:max(8px,1.1vmin) max(18px,2.6vmin);text-decoration:none;box-shadow:none;min-height:0;opacity:.8}
.skip:hover,.skip:active,.btn.ghost:hover{opacity:1;background:rgba(255,255,255,.14)}
/* answer field matches the pill system */
.answer-row{align-items:center}
.answer-row input{border-radius:var(--pill)!important;border:var(--bw) solid var(--gold)!important;padding:max(9px,1.2vmin) max(18px,2.6vmin)!important;min-height:44px;box-sizing:border-box}
.answer-row .btn{min-height:44px;padding:max(9px,1.2vmin) max(20px,3.2vmin)}
/* icon controls (circle, ghost, same size): fast-forward | sound + round-skip */
.ic{width:var(--ic);height:var(--ic);flex:none;box-sizing:border-box;border-radius:50%;padding:0;display:inline-grid;place-items:center;background:var(--ghost-bg);border:var(--bw) solid var(--ghost-bd);color:var(--ghost-fg);opacity:.45;cursor:pointer;transition:opacity .15s,background .15s;font-size:0;-webkit-tap-highlight-color:transparent}
.ic svg{width:50%;height:50%;display:block}
.ic:hover,.ic:focus-visible,.ic:active{opacity:1;background:rgba(255,255,255,.16)}
#hud #mute{position:static;transform:none;padding:0;font-size:0}
#hud .corner{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column-reverse;gap:8px;align-items:center}
#hud .corner.l{left:max(10px,2.4vmin)}
#hud .corner.r{right:max(10px,2.4vmin);flex-direction:column}
#hud .corner.l::before{content:'';width:var(--ic);height:var(--ic)}  /* mirror slot so ⏩ lines up with 🔊 */
#hud .corner.r #mute{order:0}#hud .corner.r #rskip{order:1}
#hud .corner.r:not(:has(#rskip)){padding-bottom:calc(var(--ic) + 8px)}
body:not([data-st=board]):not([data-st=picking]):not([data-st=ddsplash]) #ff{visibility:hidden}
#hud .realstrip{position:absolute;bottom:100%;left:0;right:0;text-align:center;font:500 max(10px,1.5vmin)/1.2 Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(225,230,255,.72);padding:0 18vmin 4px;pointer-events:none}
.bw .ff,.ff{display:none}
/* picker: same card treatment; 6 entries = 3x2 on landscape, compact column on phone */
.ep{border:var(--bw) solid var(--ghost-bd)!important;border-radius:14px!important;background:rgba(0,0,0,.25)!important}
.ep.sel{border-color:var(--gold)!important;background:rgba(232,184,75,.14)!important;box-shadow:0 0 0 1px var(--gold) inset!important}
@media (orientation:landscape){.eps{display:grid!important;grid-template-columns:repeat(3,1fr);width:min(150vmin,94vw)}.ep{flex:none}}
@media (orientation:portrait){.panel.intro{gap:max(12px,2.4vmin)}.eps{gap:max(7px,1.2vmin)}}
#hud #mute.ic{background:var(--ghost-bg);border:var(--bw) solid var(--ghost-bd);width:var(--ic);height:var(--ic);opacity:.45;border-radius:50%}
#hud #mute.ic:hover,#hud #mute.ic:active,#hud #mute.ic:focus-visible{opacity:1;background:rgba(255,255,255,.16)}

/* corners: FF above home (left), mute above round-skip (right) */
#hud .corner{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center}
#hud .corner.l{left:max(10px,2.4vmin)}
#hud .corner.r{right:max(10px,2.4vmin)}
#hud .corner.l::before{content:none;display:none}
#hud .corner.r:not(:has(#rskip)){padding-bottom:0}
#rskip[hidden]{visibility:hidden;display:inline-grid!important} /* keep the slot so home stays mirrored */

/* leave-game confirm */
.leave{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(2,6,40,.55);backdrop-filter:blur(4px)}
.leavecard{background:linear-gradient(180deg,#0a16a8,#060c78);border:var(--bw) solid var(--ghost-bd);border-radius:18px;padding:max(18px,3vmin) max(22px,4vmin);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45);min-width:min(260px,80vw)}

.smenu.hide{display:none}
.sitem{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;border:0;border-radius:12px;color:#fff;font:500 max(13px,2.1vmin)/1.2 Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:max(9px,1.2vmin) max(12px,1.8vmin);cursor:pointer}
.sitem:hover,.sitem.on{background:rgba(232,184,75,.16)}
.sitem.on{box-shadow:0 0 0 1px var(--gold) inset}
.sitem .scount{color:var(--gold);letter-spacing:.1em;opacity:.9}
.panel.intro .eps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:max(6px,1vmin);width:min(100vmin,94vw);flex:0 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;align-content:start;padding-bottom:max(12px,2vmin);scroll-padding-bottom:max(12px,2vmin)}
.panel.intro .ep{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:stretch;box-sizing:border-box;padding:max(10px,1.5vmin) max(12px,2vmin)!important;gap:.3em!important;min-height:auto;height:auto;overflow:visible;text-align:left;-webkit-appearance:none;appearance:none}

.panel.intro .ep .en{display:block;font:500 max(11px,1.9vmin)/1.45 Oswald,sans-serif!important;letter-spacing:.04em;text-transform:uppercase;color:rgba(230,233,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.panel.intro .ep .played{position:absolute;top:max(6px,0.8vmin);right:max(8px,1.2vmin);font:500 max(11px,1.8vmin)/1 Oswald,sans-serif;letter-spacing:.04em;color:var(--gold);opacity:.9}
.panel.intro .ep .resume{position:static;display:inline-flex;align-items:center;gap:.35em;max-width:100%;margin-top:.15em;font:500 max(10px,1.65vmin)/1.2 Oswald,sans-serif;letter-spacing:.04em;color:#9eb6ff;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function migratePlayed(rec){

  if(typeof sv.rng!=='number'||!sv.state)return false;
  if(!sv.used.every(k=>/^[0-5],[0-5]$/.test(k)))return false;
  return true;
}
function readProgress(id){

}
function clearProgress(id){

function progressLabel(sv){

}
function shouldPersist(){

}

      roundScores:Object.assign({},G.roundScores),curCol:G.curCol,stay:G.stay,
      skipped:G.skipped||null,rng:RNG.s,state:st,
      clue:G.clue?{c:G.clue.c,r:G.clue.r}:null,
      wager:G.wager,final:G.final||null,
      savedAt:new Date().toISOString()
    };
    if(!validProgress(sv,SHOW.gameId))return;
    const all=readProgressMap();all[SHOW.gameId]=sv;writeProgressMap(all);
  }catch(e){}
}
function lookupClue(sv){
  if(!sv||!sv.clue||sv.round==='F'||!SHOW.rounds[sv.round])return null;
  return SHOW.rounds[sv.round].clues.find(c=>c.c===sv.clue.c&&c.r===sv.clue.r)||null;

function resetPlay(){
  G.score=0;G.rawScore=0;G.coryat=0;G.trueScore=0;G.stole=new Set();G.roundScores={};G.clue=null;G.pending=null;G.wager=undefined;G.final=null;G.last=null;
  G.skipped=null;G.history=[];G.used=new Set();G.curCol=-1;G.stay=0;

}
function applyProgress(sv){
  G.score=sv.score;G.rawScore=sv.rawScore!=null?sv.rawScore:sv.score;G.coryat=sv.coryat||0;G.trueScore=sv.trueScore||0;G.stole=new Set(sv.stole||[]);G.round=sv.round;G.used=new Set(sv.used);
  G.curCol=sv.curCol??-1;G.stay=sv.stay||0;
  G.roundScores=Object.assign({},sv.roundScores||{});
  G.skipped=sv.skipped||null;G.wager=sv.wager;G.final=sv.final||null;G.last=null;

  applyProgress(sv);

  if(G.round==='F'){
    if(sv.wager!=null&&st!=='finalwager'&&st!=='roundend'){finalClue();return}

    if(st==='wager')ddWager(G.clue);else ddSplash(G.clue);

/* ---------- speed-adjusted scoring ----------
 * After buzzers open (end of the read, or end of the mute/show delay), a
 * correct regular-clue buzz is worth face × survival(t), paid in discrete
 * $100 steps — not a smooth value rounded only at the end. Daily Doubles
 * and Final Jeopardy are not buzzer races, so they keep full wager value.
 * Wrong answers still cost the full face amount. Triple stumpers stay at
 * full value: no one on the show got there first.
 *
 *   survival(t) = 1                     t <= grace
 *               = exp(-(t-grace)/tau)   grace < t < cutoff
 *               = 0                     t >= cutoff
 *
 * For each clue we precompute the times when that curve hits the next
 * lower $100 multiple, and award whatever step the buzz lands in. The
 * last step drops to $0 when the curve falls to $50 (half a step) or at
 * cutoff, whichever is first — otherwise a $200 clue would keep paying
 * $100 until 5s, which overvalues a late buzz.
 *
 * Constants are from published buzzer timing and from stumper/rebound
 * rates in this catalog (609 games, 36,540 clues). Tune from measured
 * first-buzz times if those become available.
 */
const SPEED={
  // Full value this long after the lights. Official lockout is 0.25s
  // (Jeopardy.com, “How Does the Jeopardy! Buzzer Work?”, 2017). Typical
  // winning/average contestant reaction times are ~0.13–0.23s: Holznagel
  // trained from 228 ms to 126 ms (Secrets of the Buzzer; Vulture, 2020);
  // he called 216 ms “very average” (Jeopardy E3 transcript); Lynn Yu
  // cites a 0.225s contestant average; Brad Rutter described the race as
  // “hundredths of a second” (Vulture, 2020). 0.30s covers that window
  // plus a little home-device lag without paying full value past the
  // “narrow sweet spot” (Ken Jennings FAQ).
  grace:0.30,

  // Hard zero. The show’s familiar 5-second clock is the time to *answer*
  // after you’re recognized, not to buzz (Wikipedia / Jeopardy! rules).
  // There is no official buzz deadline — if no one rings in, the host
  // reveals the response — but by 5s the curve is already ~2% even on a
  // hard $1000 clue (tau 1.25). Floor to $0 here.
  cutoff:5.0,

  // Seconds, Jeopardy/DJ rows 0–4 (low to high dollar). Easy first-right
  // clues are three-way reflex races: in our data row 0 is 90.6% first-
  // right and only 4.4% stumpers, so after the grace window survival
  // should fall quickly without going off a cliff. 0.65s is a hair slower
  // than 0.6s: at 0.5s an easy $200 is still full value ($147 continuous,
  // held at $200 until the $100 step at 0.75s); at 2s it is already $0.
  // Harder rows are slower recalls, not slower thumbs — stumper rates
  // rise 4.4% → 9.7% → 14.1% → 18.9% → 28.4% and first-right falls to
  // 67.3% on row 4 — so tau scales about 2×, from 0.65 to 1.25.
  tauByRow:[0.65,0.80,0.95,1.10,1.25],

  // After a miss the system is re-armed for the other two (Jeopardy.com).
  // Rebound rate is a flat ~5% across rows in our data. Less of a three-
  // way slap; 1.5s as requested, applied as max(row tau, this).
  tauRebound:1.50,

  step:100,
  // Drop to $0 when the continuous value falls to half a step.
  zeroAt:50,

  // Per-game contest factor: multiplies tau (grace is left alone — that's
  // a reaction-time window, not a field-tightness knob). More buzzing in
  // the actual game → steeper curve (smaller tau); a quiet board → a
  // gentler tail. Not ELO-based; the same evidence curve is scaled for
  // every contestant in the game.
  //
  // Activity is (correct + incorrect responses) / buzz-able clues (J!+DJ
  // minus Daily Doubles), blended with the three players' combined Coryat
  // so a knowledge-heavy game also tightens slightly. In this catalog
  // (609 games): response rate median 0.982 / mean 0.977; combined Coryat
  // median $34,600 / mean $34,224. factor = clamp(1 - k*(activity-1)),
  // activity = (1-w)*(rate/rateBaseline) + w*(coryat/coryatBaseline).
  // k=1.8 puts a typical p10 quiet game (~0.90 responses/clue) near 1.15
  // and a p90 busy one (~1.05) near 0.87; only the tails hit the clamps.
  contest:{
    min:0.80,
    max:1.25,
    rateBaseline:0.98,
    coryatBaseline:34600,
    coryatWeight:0.25,
    k:1.8
  },
  gameFactor:1,

  activity(show){
    let avail=0,responses=0,coryat=0;
    const rounds=(show&&show.rounds)||{};
    for(const rnd of ['J','DJ']){
      const clues=(rounds[rnd]&&rounds[rnd].clues)||[];
      for(const c of clues){
        if(c.dd)continue;
        avail++;
        const nr=(c.right||[]).length,nw=(c.wrong||[]).length,v=c.v||0;
        responses+=nr+nw;
        coryat+=v*nr-v*nw;
      }
    }
    return {avail,responses,coryat,rate:avail?responses/avail:this.contest.rateBaseline};
  },
  contestFactor(show){
    const cfg=this.contest,a=this.activity(show);
    const w=cfg.coryatWeight;
    const activity=(1-w)*(a.rate/cfg.rateBaseline)+w*((a.coryat||0)/cfg.coryatBaseline);
    const f=1-cfg.k*(activity-1);
    return Math.max(cfg.min,Math.min(cfg.max,f));
  },
  setGame(show){
    this.gameFactor=show?this.contestFactor(show):1;
    return this.gameFactor;
  },

  tau(clue){
    if(!clue||clue.dd)return Infinity;
    const right=clue.right||[];
    if(clue.stumper||!right.length)return Infinity;
    const row=Math.max(0,Math.min(4,clue.r|0));
    let tau=this.tauByRow[row];
    if((clue.wrong||[]).length) tau=Math.max(tau,this.tauRebound);
    return tau*this.gameFactor;
  },
  continuous(face,t,tau){
    face=+face||0;t=+t||0;
    if(!isFinite(tau))return face;
    if(t>=this.cutoff)return 0;
    if(t<=this.grace)return face;
    return face*Math.exp(-(t-this.grace)/tau);
  },
  award(face,t,tau){
    const v=this.continuous(face,t,tau);
    if(v<=this.zeroAt||t>=this.cutoff)return 0;
    return this.step*Math.ceil((v-1e-9)/this.step);
  },
  // Median first-buzz time for a field with this tau: P(T > t) = 0.5
  // on the same survival curve every contestant is scored against.
  // Used by True Score; not ELO-adjusted.
  fieldTime(tau){
    if(!isFinite(tau))return Infinity;
    return Math.min(this.cutoff, this.grace+tau*Math.LN2);
  },
  // Time the award drops TO each lower $100 multiple, and to $0.
  steps(face,tau){
    face=+face||0;
    const out=[{t:0,value:face}];
    if(!face||!isFinite(tau))return out;
    for(let amt=face-this.step;amt>=this.step;amt-=this.step){
      const t=this.grace+tau*Math.log(face/amt);
      if(t>=this.cutoff)break;
      out.push({t,value:amt});
    }
    const t0=Math.min(this.cutoff,this.grace+tau*Math.log(face/this.zeroAt));
    out.push({t:t0,value:0});
    return out;
  }
};

/* ---------- visual-only ELO (does not scale buzz speed) ---------- */
/* Formula (documented as 'ELO' here, on the end screen title/aria, and
 * in config comments; the number next to a name has no visible label).
 *
 * Each player starts at 1500. Games are processed in air-date order.
 * The number shown for an episode is the rating *before* that game
 * (career rating is the fallback when a before-rating is missing).
 *
 * 1. Finishing-order Elo. A 3-player game is three pairwise matches on
 *    Final $ (ties = 0.5). Standard expected score
 *    E = 1/(1+10^((Ropp-R)/400)), K=20, using pre-game ratings for
 *    every pair, with all deltas applied after the game. A clean 1st /
 *    2nd / 3rd among equals is +20 / 0 / −20.
 *
 * 2. Stats prior / blend. After the Elo update, a career stats prior
 *    is blended in at weight 0.25: rating = 0.75*Elo + 0.25*prior.
 *    The prior is the mean of three mappings, each 1500 at the catalog
 *    per-player-game baseline and ±400 ELO over the given spread:
 *      accuracy (R/(R+W))     center 0.875, spread 0.15
 *      average official Coryat  center $11,200, spread $8,000
 *      buzz share (R+W)/avail   center 0.333, spread 0.20
 *    Career totals are used, including games fetched from J! Archive
 *    that are not in this catalog. The blended rating is the input to
 *    the next game's expected scores.
 *
 * 3. Display only. ELO is never used to scale SPEED / True Score / tau.
 *    Color is a continuous red → yellow → green gradient interpolated
 *    across the tier thresholds below (soft/light tones so the number
 *    stays readable on the blue end-screen background).
 */
const ELO={
  start:1500,
  k:20,
  blend:0.25,
  tiers:[
    {min:0,    color:'#ff8a7a', name:'low'},
    {min:1400, color:'#ffe28a', name:'average'},
    {min:1600, color:'#c8e89a', name:'strong'},
    {min:1800, color:'#8ee6a8', name:'elite'}
  ],
  data:null,
  load(){
    if(this._p)return this._p;
    this._p=fetch('players.json').then(r=>r.ok?r.json():null).then(d=>{
      if(d&&d.players)this.data=d;
      window.__PLAYERS=this.data;
      return this.data;
    }).catch(()=>null);
    return this._p;
  },
  idFor(show,i){
    const d=this.data,gid=show&&show.gameId;
    const row=d&&d.games&&d.games[gid];
    return (row&&row[i])||null;
  },
  rating(id,gameId){
    if(id==null||!this.data||!this.data.players)return null;
    const p=this.data.players[id];
    if(!p)return null;
    if(gameId!=null&&p.b&&p.b[gameId]!=null)return p.b[gameId];
    return p.e!=null?p.e:null;
  },
  hexRgb(h){
    const n=String(h).replace('#','');
    return [parseInt(n.slice(0,2),16),parseInt(n.slice(2,4),16),parseInt(n.slice(4,6),16)];
  },
  lerpHex(a,b,t){
    const A=this.hexRgb(a),B=this.hexRgb(b);
    const c=A.map((x,i)=>Math.round(x+(B[i]-x)*Math.min(1,Math.max(0,t))));
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
  },
  rgb(c){return this.lerpHex(c,c,0)},
  color(n){
    const ts=this.tiers;
    if(!ts.length||n==null||!isFinite(n))return this.rgb((ts[0]&&ts[0].color)||'#ffffff');
    if(n<=ts[0].min)return this.rgb(ts[0].color);
    for(let i=1;i<ts.length;i++){
      if(n<=ts[i].min){
        const span=ts[i].min-ts[i-1].min;
        return this.lerpHex(ts[i-1].color,ts[i].color,span?(n-ts[i-1].min)/span:1);
      }
    }
    return this.rgb(ts[ts.length-1].color);
  },
  badge(n){
    if(n==null||!isFinite(n))return '';
    const v=Math.round(n);
    return `<span class="elo" style="color:${this.color(v)}" title="ELO ${v}" aria-label="ELO ${v}">${v}</span>`;
  }
};
ELO.load();


/* ---------- True Score (head-to-head, same evidence curve as SPEED) ---------- */
/* On a regular first-right clue, the user is racing a modeled first-buzz
 * at the median of the survival curve (grace + tau·ln 2), using the same
 * row / rebound / stumper / contest-factor tau as speed-adjusted scoring
 * — never ELO. If the user buzzes correctly before that instant they take
 * the clue (paid in $100 steps) and the contestant who actually got it
 * loses that clue's face value on the end-screen recap. If the field
 * would have been faster, the user gets $0 for the clue even if right.
 * Being slow never costs the user; only a wrong answer does (full face).
 * Rebounds and triple stumpers are not races: a correct answer pays the
 * (possibly rebound-decayed) award, and the original contestant keeps
 * their result. Daily Doubles stay with their original owner; the user's
 * own Daily Double and Final Jeopardy apply the wager the usual way.
 */
function clueKey(c,round){return (round||G.round)+','+c.c+','+c.r}
function isRaceClue(c){
  if(!c||c.dd||c.stumper)return false;
  if((c.wrong||[]).length)return false;
  if(!(c.right||[]).length)return false;
  return isFinite(SPEED.tau(c));
}
function trueAward(c,ok,mode,t){
  const face=c.v||0;
  if(mode==='dd'||mode==='final') return ok? (G.wager||0) : -(G.wager||0);
  if(!ok) return (mode==='buzz')?-face:0;
  const tau=SPEED.tau(c);
  if(!isRaceClue(c)) return SPEED.award(face,t,tau);
  return (t<SPEED.fieldTime(tau))?SPEED.award(face,t,tau):0;
}
function contestantCoryat(short){
  let n=0;
  for(const rnd of ['J','DJ']){
    const clues=(SHOW.rounds[rnd]&&SHOW.rounds[rnd].clues)||[];
    for(const c of clues){
      const v=c.v||0;
      if((c.right||[]).includes(short))n+=v;
      else if((c.wrong||[]).includes(short))n-=v;
    }
  }
  return n;
}
function contestantTrue(short){
  let n=(SHOW.scores.Final||{})[short];
  if(n==null)n=0;
  const stole=G.stole||new Set();
  for(const rnd of ['J','DJ']){
    const clues=(SHOW.rounds[rnd]&&SHOW.rounds[rnd].clues)||[];
    for(const c of clues){
      if(!isRaceClue(c))continue;
      if(!(c.right||[]).includes(short))continue;
      if(stole.has(rnd+','+c.c+','+c.r)) n-=(c.v||0);
    }
  }
  return n;
}

function loadShow(id){

  const meta=CATALOG.find(e=>e.gameId===id)||CATALOG[0];
  return fetch('episodes/'+meta.gameId+'.json').then(r=>{if(!r.ok)throw new Error('episode '+r.status);return r.json()}).then(d=>{SHOW=Object.assign({},meta,d);window.__SHOW=SHOW;SPEED.setGame(SHOW);return SHOW});
}

/* ---------- sound (tiny WebAudio blips) ---------- */
let AC=null;
function tone(f,d,type='sine',v=.12,delay=0){ if(!G.sound||G.paused)return; try{

  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){} }
const sfx={
 open(){tone(880,.08,'square',.06)},
 buzz(){tone(520,.12,'triangle',.15)},
 good(){tone(660,.15,'sine',.15);tone(880,.25,'sine',.15,.12)},
 bad(){tone(130,.5,'sawtooth',.12)},

/* ---------- clue read-aloud (speechSynthesis) ---------- */
/* Host-pace timing: the lights / buzzers / answer prompt arm when a
 * real host would finish the clue, not when our TTS happens to end.
 * 2.7 words/sec (162 wpm) is a touch quicker than typical conversational
 * American English (~150 wpm / 2.5 wps) and matches a measured-style
 * Jeopardy! host cadence. TTS is sped up just enough to finish slightly
 * early (early=0.12, ~12% of host time) so the last word is out before
 * the lights. The utterance is NEVER cancelled for timing — if a voice
 * runs long, it keeps playing after the buzzers open. Skip, home, round-
 * skip, and the mute button still cancel, as a leave of the clue.
 */
const Voice={
  tok:0, text:null, onDone:null, active:false, voice:null,
  read:{
    hostWps:2.7,
    early:0.12,
    minMs:700,
    minRate:0.85,
    maxRate:1.5
  },
  wordCount(text){
    return String(text||'').trim().split(/\s+/).filter(Boolean).length;
  },
  hostMs(text){
    const w=this.wordCount(text);
    if(!w)return 0;
    return Math.max(this.read.minMs, Math.round(1000*w/this.read.hostWps));
  },
  rateFor(text){
    const early=this.read.early;
    const r=early>=1?this.read.maxRate:1/(1-early);
    return Math.max(this.read.minRate, Math.min(this.read.maxRate, r));
  },
  enabled(){return !AUTO&&!FAST&&!G.voiceMute&&!!window.speechSynthesis},
  pick(){
    if(!window.speechSynthesis)return null;
    const vs=speechSynthesis.getVoices()||[];
    const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang||'')||/english/i.test(v.name||''));
    const pool=en.length?en:vs;
    const score=v=>{
      const n=(v.name||'')+' '+(v.voiceURI||'');
      if(/premium/i.test(n))return 300;
      if(/enhanced/i.test(n))return 200;
      if(/\b(Ava|Zoe|Samantha|Google US English)\b/i.test(n))return 100;
      if(/en-US/i.test(v.lang))return 50;
      if(/^en/i.test(v.lang))return 20;
      return 0;
    };
    let best=null,bestS=-1;
    for(const v of pool){const sc=score(v);if(sc>bestS){best=v;bestS=sc}}
    this.voice=best||pool[0]||null;return this.voice;
  },
  unlock(){
    if(!window.speechSynthesis)return;
    try{
      this.pick();
      const u=new SpeechSynthesisUtterance(' ');
      u.volume=0;u.rate=10;if(this.voice)u.voice=this.voice;
      speechSynthesis.speak(u);speechSynthesis.cancel();
    }catch(e){}
  },
  cancel(){
    this.tok++;this.text=null;this.onDone=null;this.active=false;
    try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  },
  speak(text,onDone){
    const hostMs=this.hostMs(text);
    const tok=++this.tok;
    this.text=text||'';this.onDone=onDone;this.active=false;
    const arm=()=>{
      later(()=>{if(tok!==this.tok)return;this.onDone=null;onDone&&onDone()},R(hostMs||0));
    };
    if(!String(text||'').trim()||AUTO||FAST||!this.enabled()){
      arm();
      return;
    }
    this.pick();
    this.active=true;
    const rate=this.rateFor(text);
    try{
      // Drop a leftover utterance from a previous clue only — never
      // cancel this clue's speech to open the buzzers.
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      if(this.voice){u.voice=this.voice;u.lang=this.voice.lang||'en-US'}else u.lang='en-US';
      u.rate=rate;
      u.onend=()=>{if(tok!==this.tok)return;this.active=false;if(this.text===text)this.text=null};
      u.onerror=()=>{if(tok!==this.tok)return;this.active=false};
      speechSynthesis.speak(u);
    }catch(e){this.active=false}
    arm();
  },
  pause(){

const sched=[];
function later(fn,ms){
  const rec={kind:'to',fn,remain:ms,start:performance.now(),id:null};
  rec.id=setTimeout(()=>{dropSched(rec);fn()},ms);
  sched.push(rec);G.timers.push(rec.id);return rec.id;
}
function runTimer(ms,onTick,onDone){
  const rec={kind:'iv',onTick,onDone,remain:ms,total:ms,start:performance.now(),id:null};
  const tick=()=>{
    const left=rec.start+rec.remain-performance.now();
    if(left<=0){clearInterval(rec.id);dropSched(rec);onTick(0,0);onDone();return}
    onTick(left/rec.total,Math.ceil(left/1000));
  };
  rec.id=setInterval(tick,50);
  sched.push(rec);G.timers.push(rec.id);
  onTick(1,Math.ceil(ms/1000));
}
function dropSched(rec){const i=sched.indexOf(rec);if(i>=0)sched.splice(i,1)}
function syncTimerIds(){G.timers=sched.map(r=>r.id).filter(Boolean)}
function freezeSched(){
  const t=performance.now();
  for(const rec of sched){
    if(rec.kind==='to'){clearTimeout(rec.id);rec.remain=Math.max(0,rec.remain-(t-rec.start))}
    else{clearInterval(rec.id);rec.remain=Math.max(0,rec.start+rec.remain-t)}
    rec.id=null;
  }
  G.timers=[];
}
function thawSched(){
  const t=performance.now();
  for(const rec of sched){
    rec.start=t;
    if(rec.kind==='to') rec.id=setTimeout(()=>{dropSched(rec);rec.fn()},rec.remain);
    else rec.id=setInterval(()=>{
      const left=rec.start+rec.remain-performance.now();
      if(left<=0){clearInterval(rec.id);dropSched(rec);rec.onTick(0,0);rec.onDone();return}
      rec.onTick(left/rec.total,Math.ceil(left/1000));
    },50);
  }
  syncTimerIds();
}
function clearTimers(){
  for(const rec of sched.splice(0)){if(rec.kind==='to')clearTimeout(rec.id);else clearInterval(rec.id)}
  G.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});G.timers=[];

}

function fit(box,el,max,min=9){

  }

        <span class="ed">${esc(e.show)} · ${fmt(e)}</span>

/* semi-random, human-ish selection: favours high values, tends to stay in the category, sometimes jumps */
function choose(){
  const avail=SHOW.rounds[G.round].clues.filter(c=>!G.used.has(c.c+','+c.r));
  const inCol=avail.filter(c=>c.c===G.curCol);
  let jump=G.curCol<0||inCol.length===0||RNG.next()<0.14||G.stay>=5&&RNG.next()<0.5;
  const pool=jump?avail.filter(c=>c.c!==G.curCol||avail.length===inCol.length):avail;
  const w=c=>{
    let x=Math.pow(c.r+1,1.6);                         // higher value → heavier
    if(!jump&&c.c===G.curCol) x*=4.5;                   // stay in the same category
    return x*(0.6+RNG.next()*0.8);                      // noise: no tidy top-to-bottom runs
  };
  const ws=pool.map(w),tot=ws.reduce((a,b)=>a+b,0);
  let t=RNG.next()*tot;for(let i=0;i<pool.length;i++){t-=ws[i];if(t<=0)return {clue:pool[i],jump}}
  return {clue:pool[pool.length-1],jump};
}
function skipRound(){
  if(G.paused)return;
  if(G.round!=='J'&&G.round!=='DJ')return;
  const from=G.round;clearTimers();setLights(null);G.pending=null;G.clue=null;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  G.roundScores[from]=G.score;G.skipped=from;
  from==='J'?startRound('DJ'):finalIntro();
}
function fastForward(){
  if(G.paused)return;
  if(G.state==='board'){clearTimers();pickNext()}
  else if(G.state==='picking'||G.state==='ddsplash'){clearTimers();const f=G.pending;G.pending=null;f&&f()}
}
function pickNext(){
  if(G.used.size>=30)return roundEnd();
  const {clue,jump}=choose();
  G.stay=(!jump&&clue.c===G.curCol)?G.stay+1:1;G.curCol=clue.c;
  G.used.add(clue.c+','+clue.r);G.clue=clue;
  renderBoard(clue.c+','+clue.r);renderHud();setState('picking');
  G.pending=()=>clue.dd?ddSplash(clue):showClue(clue);
  saveProgress();
  later(G.pending,R(1000));
}

function buzz(){
  if(G.paused)return;
  const now=performance.now();
  if(G.state==='reading'){
    if(now<G.lockedUntil)return;
    G.lockedUntil=now+LOCKOUT_MS;sfx.lock();setLights('bad');
    $('#foot').insertAdjacentHTML('afterbegin','<div class="hint"><span class="lock">TOO EARLY! Locked out</span></div>');

    if(now<G.lockedUntil)return;
    const rt=Math.round(now-G.openAt);
    G.reaction=rt;clearTimers();setState('answer');setLights(null);sfx.buzz();

/* ---------- judging ---------- */
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function norm(s){
  s=String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
   .replace(/&/g,' and ').replace(/[’‘`']/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^(what|whats|who|whos|where|wheres|when|whens|how)( (is|are|was|were|s))?\b\s*/,'');
  s=s.replace(/^(is|are|was|were)\s+(?=(a|an|the)\b)/,'');
  s=s.replace(/^(a|an|the)\s+/,'');
  return s.split(' ').map(t=>/^\d+$/.test(t)&&+t<=20?NUMW[+t]:t).join(' ').trim();
}
function variants(ans){
  const out=new Set();
  const base=[ans.replace(/\s*\([^)]*\)/g,' '),ans.replace(/[()]/g,' ')];
  for(const b of base){
    out.add(b);
    b.split(/\s+or\s+|\s*\/\s*|;\s*/i).forEach(p=>out.add(p));
  }
  for(const v of [...out]){const m=v.split(/\s+(?:&|and)\s+/);if(m.length===2)out.add(m[1]+' and '+m[0])}
  return [...out].map(norm).filter(Boolean);
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[n];
}
function judge(user,ans){
  const u=norm(user);if(!u)return false;
  const us=u.replace(/ /g,'');
  for(const v of variants(ans)){
    if(u===v)return true;
    const vs=v.replace(/ /g,'');
    if(us===vs)return true;
    const d=lev(us,vs),L=Math.max(us.length,vs.length);
    if(L>=4&&d<=Math.max(1,Math.floor(L*0.2))&&1-d/L>=0.8)return true;
    if(vs.length>=5&&(' '+u+' ').includes(' '+v+' ')&&u.split(' ').length<=v.split(' ').length+1)return true;
  }
  return false;
}
window.__judge=judge;

/* ---------- results ---------- */
function realNote(c){
  const bits=[];
  if(c.dd){
    const who=(c.right[0]||c.wrong[0]||'The contestant');
    return `On the show, <b>${esc(who)}</b> found the Daily Double, wagered <b>${money(c.ddWager)}</b> and ${c.right.length?'got it <b>right</b>':'<b>missed</b>'}.`;
  }
  if(c.stumper)return 'On the show: <b>triple stumper</b> — nobody got it.';
  if(c.right.length)bits.push(`<b>${c.right.map(esc).join(', ')}</b> got it right`);
  if(c.wrong.length)bits.push(`<b>${c.wrong.map(esc).join(', ')}</b> missed`);
  return 'On the show: '+bits.join('; ')+'.';
}
function finishClue(c,txt,mode,timedOut){
  clearTimers();setLights(null);
  const value=mode==='dd'?G.wager:c.v;
  let verdict,cls,delta=0;
  if(mode==='nobuzz'){verdict='Time’s up — no one buzzed';cls='meh';}
  else if(mode==='skip'){verdict='Skipped';cls='meh';}
  else{
    const ok=txt&&judge(txt,c.a);
    const t=(mode==='buzz'&&G.reaction!=null)?G.reaction/1000:0;
    const awarded=(ok&&mode==='buzz')?SPEED.award(value,t,SPEED.tau(c)):value;
    delta=ok?awarded:-value;
    verdict=ok?'Correct!':(timedOut&&!(txt||'').trim()?'Time’s up!':'Incorrect');cls=ok?'good':'bad';
    G.rawScore=(G.rawScore||0)+(ok?value:-value);
    G.score+=delta;(ok?sfx.good:sfx.bad)();
    G.lastBuzzT=t;
    const face=c.v||value;
    G.coryat=(G.coryat||0)+(ok?face:-face);
    const td=trueAward(c,ok,mode,t);
    G.trueScore=(G.trueScore||0)+td;
    if(ok&&isRaceClue(c)&&td>0){ (G.stole||(G.stole=new Set())).add(clueKey(c)); }
  }
  G.last={c,delta,value,txt,mode,cls};
  const wasRight=cls==='good';
  setState('result');
  renderHud();
  S(`<div class="panel">
    <div class="sub">${esc(catName())} · ${money(mode==='dd'?G.wager:c.v)}${mode==='dd'?' · Daily Double':''}</div>
    <div class="verdict ${cls}">${verdict}</div>
    ${delta?`<div class="h1 ${delta>0?'gold':''}" style="font-size:min(7vw,10vh)">${delta>0?'+':'−'}${money(Math.abs(delta)).replace('-','')}${cls==='good'&&delta>0&&delta!==value?` <span class="of">of ${money(value)}</span>`:''}</div>`:''}
    ${txt!==null&&txt!==undefined?`<div class="typed">You answered: <b>${esc(txt.trim()||'(nothing)')}</b></div>`:''}
    <div class="sub">Correct response</div>
    <div class="serif" style="font-size:max(20px,5vmin);color:var(--gold-b);text-shadow:.3vmin .35vmin 0 #000">${esc(c.a)}</div>
    <div class="note">${realNote(c)}</div>
    <div class="contestants" style="gap:2vmin">
     ${cls==='bad'?'<button class="btn ghost" id="override">I was right (override)</button>':''}
     <button class="btn" id="next">Next ▸</button></div>
    </div>`);
  $('#next').onclick=nextAfterResult;
  const ov=$('#override');
  if(ov)ov.onclick=()=>{
    const t=(G.last.mode==='buzz'&&G.reaction!=null)?G.reaction/1000:0;
    const awarded=G.last.mode==='buzz'?SPEED.award(value,t,SPEED.tau(c)):value;
    G.score+=value+awarded;G.rawScore=(G.rawScore||0)+2*value;
    G.coryat=(G.coryat||0)+2*(c.v||value);
    const td=trueAward(c,true,G.last.mode,t);
    // undo the wrong-answer true penalty (buzz: −face; dd: −wager) then apply the correct award
    const penalty=trueAward(c,false,G.last.mode,t);
    G.trueScore=(G.trueScore||0)-penalty+td;
    if(isRaceClue(c)&&td>0){ (G.stole||(G.stole=new Set())).add(clueKey(c)); }
    else if(G.stole) G.stole.delete(clueKey(c));
    G.last.cls='good';G.last.delta=awarded;
    ov.remove();renderHud();
    const v=$('.verdict');v.className='verdict good';v.textContent='Overruled — correct!';sfx.good();
    const h=$('.h1');if(h)h.innerHTML=`+${money(awarded)}${awarded!==value?` <span class="of">of ${money(value)}</span>`:''}`;
    if(h)h.classList.add('gold');
    saveProgress();
  };
  saveProgress();
}
function nextAfterResult(){
  if(G.state!=='result')return;
  clearTimers();
  if(G.last.mode==='final')return endScreen();
  setState('board');renderBoard();renderHud();later(pickNext,R(2900));
}

/* ---------- round end / final ---------- */
function roundEnd(){
  clearTimers();setState('roundend');
  G.roundScores[G.round]=G.score;
  const r=G.round,real=SHOW.scores[r];
  const rows=[[YOU,G.score,true],...SHOW.contestants.map(c=>[c.name,real[c.short],false])].sort((a,b)=>b[1]-a[1]);
  S(`<div class="panel"><div class="h1">${r==='J'?'Jeopardy! Round':'Double Jeopardy! Round'}</div>
   <table class="cmp"><tr><th>Contestant</th><th>Score</th></tr>
   ${rows.map(x=>`<tr class="${x[2]?'me':''}"><td>${esc(x[0])}</td><td class="${x[1]<0?'neg':''}">${money(x[1])}</td></tr>`).join('')}</table>
   <button class="btn" id="cont">${r==='J'?'On to Double Jeopardy!':'On to Final Jeopardy!'}</button></div>`);
  $('#cont').onclick=()=>r==='J'?startRound('DJ'):finalIntro();
  renderHud();
  saveProgress();
}
function finalIntro(){
  clearTimers();G.round='F';setLights(null);setState('finalwager');renderHud();
  const F=SHOW.final;
  if(G.score<=0){
    S(`<div class="panel"><div class="logo" style="font-size:min(9vw,14vh)">Final Jeopardy!</div><div class="h1 gold">${esc(F.cat)}</div>
      <div class="note">With ${money(G.score)}, you don't qualify to play Final Jeopardy — just like on the show.</div>
      <button class="btn" id="cont">See the results</button></div>`);
    G.wager=0;G.last={mode:'final',skip:true};
    $('#cont').onclick=()=>{G.final={played:false,delta:0};endScreen()};
    saveProgress();
    return;
  }
  S(`<div class="panel"><div class="logo" style="font-size:min(9vw,14vh)">Final Jeopardy!</div><div class="h1 gold">${esc(F.cat)}</div>
    <div class="sub">You have <span class="gold">${money(G.score)}</span> · wager <span class="gold">$0</span> to <span class="gold">${money(G.score)}</span></div>
    <div class="answer-row" style="max-width:70vmin"><input id="wg" type="text" inputmode="numeric" autocomplete="off" placeholder="$ amount"><button class="btn" id="wgo">Lock in</button></div>
    <div class="contestants" style="gap:1vmin"><button class="btn ghost" data-w="0">$0</button><button class="btn ghost" data-w="${Math.round(G.score/2)}">Half</button><button class="btn ghost" data-w="${G.score}">Everything</button></div>
    <div class="hint" id="wmsg">&nbsp;</div></div>`);
  const inp=$('#wg');inp.focus({preventScroll:true});
  const go=()=>{
    const raw=inp.value.replace(/[^\d]/g,'');const n=raw===''?NaN:parseInt(raw,10);
    if(!(n>=0&&n<=G.score)){$('#wmsg').innerHTML=`<span class="lock">Wager must be between $0 and ${money(G.score)}</span>`;return}
    G.wager=n;saveProgress();finalClue();
  };
  $('#wgo').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.w;go()});
  G.wagerGo=go;
  saveProgress();
}
function finalClue(){
  const F=SHOW.final;setState('reading');
  const c={q:F.q,a:F.a,v:G.wager,img:false};
  S(cardHtml(c,{cat:F.cat,wager:G.wager}));
  Voice.speak(F.q,()=>{
    if(G.state!=='reading')return;
    setState('answer');
    askAnswer(c,{ms:FINAL_MS,prefix:'',cb:(t,to)=>{
    clearTimers();
    const ok=t&&judge(t,F.a);const delta=ok?G.wager:-G.wager;G.score+=delta;G.rawScore=(G.rawScore||0)+delta;G.trueScore=(G.trueScore||0)+delta;(ok?sfx.good:sfx.bad)();
    G.final={played:true,delta,txt:t,ok};G.last={mode:'final',cls:ok?'good':'bad',delta,value:G.wager};
    setState('result');renderHud();
    S(`<div class="panel"><div class="sub">${esc(F.cat)} · your wager ${money(G.wager)}</div>
     <div class="verdict ${ok?'good':'bad'}">${ok?'Correct!':(to&&!(t||'').trim()?'Time’s up!':'Incorrect')}</div>
     <div class="h1 ${ok?'gold':''}" style="font-size:min(7vw,10vh)">${ok?'+':'−'}${money(G.wager)}</div>
     <div class="typed">You answered: <b>${esc((t||'').trim()||'(nothing)')}</b></div>
     <div class="sub">Correct response</div>
     <div class="serif" style="font-size:max(20px,5vmin);color:var(--gold-b);text-shadow:.3vmin .35vmin 0 #000">${esc(F.a)}</div>
     <div class="note">On the show: ${F.right.length?`<b>${F.right.map(esc).join(', ')}</b> got it right`:''}${F.wrong.length?`; <b>${F.wrong.map(esc).join(', ')}</b> missed`:''}.</div>
     <div class="contestants" style="gap:2vmin">${ok?'':'<button class="btn ghost" id="override">I was right (override)</button>'}<button class="btn" id="next">See the final results ▸</button></div>
     </div>`);
    $('#next').onclick=nextAfterResult;
    const ov=$('#override');if(ov)ov.onclick=()=>{G.score+=2*G.wager;G.rawScore=(G.rawScore||0)+2*G.wager;G.trueScore=(G.trueScore||0)+2*G.wager;G.final.delta=G.wager;G.final.ok=true;G.last.cls='good';ov.remove();renderHud();const v=$('.verdict');v.className='verdict good';v.textContent='Overruled — correct!';sfx.good()};
    }});
  });
}

/* ---------- end ---------- */
const ORD=n=>['1st','2nd','3rd','4th'][n-1];
function endScreen(){
  clearTimers();setState('end');setLights(null);
  G.roundScores.F=G.score;
  clearProgress(SHOW.gameId);
  savePlayed(SHOW.gameId,G.score,G.rawScore||0);
  const fin=SHOW.scores.Final;
  const people=SHOW.contestants.map((c,i)=>{
    const id=ELO.idFor(SHOW,i);
    return {name:c.name,short:c.short,score:fin[c.short],raw:fin[c.short],adj:fin[c.short],trueScore:contestantTrue(c.short),coryat:contestantCoryat(c.short),real:true,j:SHOW.scores.J[c.short],dj:SHOW.scores.DJ[c.short],elo:ELO.rating(id,SHOW.gameId)};
  });
  const me={name:'You',score:G.score,raw:G.rawScore||0,adj:G.score,trueScore:G.trueScore||0,coryat:G.coryat||0,real:false,j:G.roundScores.J??0,dj:G.roundScores.DJ??0};
  const all=[...people,me].sort((a,b)=>b.score-a.score||(a.real?-1:1)); // ties: the real contestant keeps the nod
  const place=all.indexOf(me)+1;
  const winner=all[0];
  const realRank=[...people].sort((a,b)=>b.score-a.score).map(p=>p.short);
  const remarks={};realRank.forEach((n,i)=>remarks[n]=i===0?'Winner on the show':ORD(i+1)+' on the show');
  let headline;
  if(place===1)headline=`You win! You'd have beaten ${winner===me?'the whole podium':''} and ended the streak in style.`;
  else headline=`You would have placed <span class="gold">${ORD(place)}</span>`;
  const beat=people.filter(p=>p.score<me.score).map(p=>p.name.split(' ')[0]);
  const lost=people.filter(p=>p.score>=me.score).map(p=>p.name.split(' ')[0]);
  const detail=place===1?`You finished ahead of ${beat.join(', ')}.`:
    (beat.length?`You finished ahead of ${beat.join(' and ')}, but behind ${lost.join(' and ')}.`:`${lost.join(', ')} finished ahead of you.`);
  S(`<div class="panel endpanel"><div class="sub">${esc(SHOW.show)} · ${new Date(SHOW.aired+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
   <div class="h1" style="font-size:min(7vw,8.5vh)">${place===1?'You <span class="gold">win!</span>':headline}</div>
   <div class="sub" style="letter-spacing:.08em;text-transform:none;font-size:max(13px,2.6vmin)">${detail}</div>
   <div class="endwrap"><table class="cmp end"><tr><th>#</th><th>Contestant</th><th>After J!</th><th>After DJ!</th><th>Raw</th><th>Speed-adj</th></tr>
   ${all.map((p,i)=>`<tr class="${p.real?'':'me'}"><td>${i+1}</td><td>${esc(p.name)}${p.real?ELO.badge(p.elo):''}${p.real?`<small>${esc(remarks[p.short])}</small>`:'<small>your game</small>'}<small class="tsline">True ${money(p.trueScore||0)} · Coryat ${money(p.coryat||0)}</small></td>
     <td class="${p.j<0?'neg':''}">${money(p.j)}</td><td class="${p.dj<0?'neg':''}">${money(p.dj)}</td>
     <td class="${(p.raw??p.score)<0?'neg':''}">${money(p.raw??p.score)}</td><td class="${(p.adj??p.score)<0?'neg':''}">${money(p.adj??p.score)}</td></tr>`).join('')}</table></div>
   <div class="contestants"><button class="btn" id="again">Play again</button></div></div>`);
  $('#again').onclick=()=>{location.reload()};
  renderHud();
  window.__result={place,score:G.score,raw:G.rawScore||0,adj:G.score,trueScore:G.trueScore||0,coryat:G.coryat||0};
}

/* ---------- input ---------- */
document.addEventListener('keydown',e=>{
  const st=G.state,age=performance.now()-G.stateAt;
  const inField=e.target&&e.target.tagName==='INPUT';
  if($('#catpop')){
    if(e.key==='Escape'||e.key==='Enter'||e.key==='p'||e.key==='P'||e.code==='Space'||e.key===' '){e.preventDefault();closeCatNote()}
    return;
  }
  const isP=e.key==='p'||e.key==='P';
  const isSpace=e.code==='Space'||e.key===' ';
  const spaceBusy=(st==='reading'||st==='open'||st==='intro'||st==='result'||st==='roundend'||(st==='finalwager'&&!$('#wg')));
  if(!e.repeat&&canTypePause(e)&&(isP||(isSpace&&(G.paused||!spaceBusy)))){e.preventDefault();togglePause();return}
  if(G.paused){if(isSpace||e.key==='Enter'||e.key==='s'||e.key==='S'||e.key==='Escape')e.preventDefault();return}
  if((st==='reading'||st==='open')&&isSpace){e.preventDefault();if(!e.repeat)buzz();return}
  if((st==='reading'||st==='open')&&(e.key==='s'||e.key==='S'||e.key==='Escape')){e.preventDefault();skipClue();return}
  if(inField)return;
  if(e.key==='Enter'||isSpace){
    if(st==='intro'){e.preventDefault();$('#go').click()}
    else if(st==='result'&&age>500){e.preventDefault();nextAfterResult()}
    else if(st==='roundend'&&age>400){e.preventDefault();$('#cont').click()}
    else if(st==='finalwager'&&!$('#wg')&&age>400){e.preventDefault();$('#cont').click()}
  }
});
stage.addEventListener('pointerdown',e=>{ if(G.paused)return; if(AC&&AC.state==='suspended')AC.resume(); Voice.unlock() });
stage.addEventListener('click',e=>{
  const cat=e.target.closest('#set .board .cat');
  if(!cat)return;
  e.preventDefault();
  const i=+cat.dataset.c;
  if(Number.isInteger(i))openCatNote(i);
});
stage.addEventListener('keydown',e=>{
  const cat=e.target.closest&&e.target.closest('#set .board .cat');
  if(!cat)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();openCatNote(+cat.dataset.c)}
});


/* ---------- debug autoplay (?auto=1[&fast=1]) : plays the whole show by itself ---------- */
if(AUTO){
  setInterval(()=>{
    if(G.paused)return;
    const st=G.state,age=performance.now()-G.stateAt;
    if(st==='intro')$('#go').click();
    else if(st==='open'&&age>80)buzz();
    else if(st==='answer'&&$('#ans')&&!$('#ans').dataset.f){
      const inp=$('#ans');inp.dataset.f=1;
      const c=G.round==='F'?{a:SHOW.final.a}:G.clue;
      inp.value=Math.random()<.65?'what is '+c.a.replace(/\(|\)/g,''):'definitely wrong';
      setTimeout(()=>G.submitAnswer&&G.submitAnswer(),120);
    }
    else if(st==='wager'&&$('#wg')&&!$('#wg').dataset.f){const inp=$('#wg');inp.dataset.f=1;inp.value=String(Math.min(Math.max(G.score,5),1000));G.wagerGo()}
    else if(st==='finalwager'&&$('#wg')&&!$('#wg').value){$('#wg').value=String(Math.round(G.score/2));G.wagerGo()}
    else if(st==='finalwager'&&!$('#wg')&&age>600)$('#cont').click();
    else if(st==='result'&&age>600)nextAfterResult();
    else if(st==='roundend'&&age>600)$('#cont').click();
  },200);
}
window.__G=G;window.__startRound=startRound;window.__loadShow=loadShow;window.__savePlayed=savePlayed;window.__readPlayed=readPlayed;window.__setPaused=setPaused;window.__togglePause=togglePause;window.__clearTimers=clearTimers;window.__openCatNote=openCatNote;window.__closeCatNote=closeCatNote;window.__Voice=Voice;window.__SPEED=SPEED;window.__trueAward=trueAward;window.__contestantCoryat=contestantCoryat;window.__contestantTrue=contestantTrue;window.__ELO=ELO;window.__SHOW=SHOW;window.__endScreen=endScreen;window.__finishClue=finishClue;window.__RNG=RNG;window.__saveProgress=saveProgress;window.__readProgress=readProgress;window.__clearProgress=clearProgress;window.__resetPlay=resetPlay;window.__resumeGame=resumeGame;
intro();
})();

</script>
